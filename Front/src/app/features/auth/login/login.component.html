<div id="login-full-width">
  <div class="login-container">
    <div id="first-container-login">
      <div id="title-container-login">
        <h1>Technology Solutions</h1>
      </div>
      <form>
        <div>
          <label for="cpf">CPF:</label><br>
          <input
            type="text"
            placeholder="Digite seu CPF"
            mask = "000.000.000-00"
            (blur)="validateCpf(loginData.cpf)"
            [(ngModel)]="loginData.cpf"
            name="cpf"
            class="input"
          />
          <p *ngIf="isCpfValid === false" class="error-message">CPF inválido.</p>
        </div>
        <div>
          <label for="password">Senha:</label><br>
          <input
            type="password"
            placeholder="Digite sua senha"
            (blur)="validatePassword(loginData.password)"
            [(ngModel)]="loginData.password"
            name="password"
            class="input"
          />
          <p *ngIf="isPasswordValid === false" class="error-message">
            A senha deve ter no mínimo 8 caracteres, contendo letras maiúsculas, minúsculas, números e caracteres especiais.
          </p>
        </div>
        <button type="submit" class="default-btn" (click)="checkValidData($event, loginData)">Confirmar</button>
      </form>
    </div>
    <div id="second-container-login">
    </div>
  </div>
</div>
